[package]
name = "rudof_nif"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rudof_lib = { git = "https://github.com/rudof-project/rudof.git", rev = "393f45e9d79ff18abc6ed237c675e4a9f8809bcd", default-features = false, features = ["sparql", "dctap", "conversion", "comparison", "pgschema", "rdf-config", "pg-db", "qlever"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rustler = "0.38.0"
stacker = "0.1"
tokio = { version = "1", features = ["rt", "time", "net"] }

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
